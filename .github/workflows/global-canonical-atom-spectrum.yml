name: Erdős 593 global canonical atom spectrum

on:
  pull_request:
    paths:
      - 'reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md'
      - 'reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.tex'
      - 'experiments/verify_global_canonical_atom_spectrum.py'
      - 'experiments/global_canonical_atom_spectrum_results.json'
      - '.github/workflows/global-canonical-atom-spectrum.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-canonical-atom-spectrum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python -m py_compile experiments/verify_global_canonical_atom_spectrum.py
      - name: Reproduce exact audit
        run: |
          python experiments/verify_global_canonical_atom_spectrum.py \
            --output /tmp/global_canonical_atom_spectrum_results.json
          diff -u \
            experiments/global_canonical_atom_spectrum_results.json \
            /tmp/global_canonical_atom_spectrum_results.json
      - name: Check theorem interfaces
        run: |
          grep -F '## The forest-additive law' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md
          grep -F '## Global feasibility' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md
          grep -F '## Prescribed cyclic atom-rank partition' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md
          grep -F '## Prescribed component-rank profile' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md
          grep -F '## Exact number of cyclic components' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md
          grep -F '## Exact total atom-count spectrum' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.md
          grep -F '\begin{theorem}[Forest-additive law]' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.tex
          grep -F '\begin{theorem}[Global canonical atom-count spectrum]' reader-first/GLOBAL_CANONICAL_ATOM_SPECTRUM.tex
