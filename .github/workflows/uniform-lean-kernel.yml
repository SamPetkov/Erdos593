name: Uniform Lean kernel

on:
  push:
    branches: [agent/uniform-lean-kernel]
    paths:
      - 'formalization/Erdos593/UniformSystem/**'
      - 'formalization/Erdos593/UniformSystem.lean'
      - 'UNIFORM_LEAN_FORMALIZATION.md'
      - '.github/workflows/uniform-lean-kernel.yml'
  pull_request:
    paths:
      - 'formalization/Erdos593/UniformSystem/**'
      - 'formalization/Erdos593/UniformSystem.lean'
      - 'UNIFORM_LEAN_FORMALIZATION.md'
      - '.github/workflows/uniform-lean-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: formalization
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          auto-config: false
          use-mathlib-cache: true
      - name: Compile Basic
        run: lake env lean -DwarningAsError=true Erdos593/UniformSystem/Basic.lean
      - name: Compile Levi
        run: lake env lean -DwarningAsError=true Erdos593/UniformSystem/Levi.lean
      - name: Compile BridgeCount
        run: lake env lean -DwarningAsError=true Erdos593/UniformSystem/BridgeCount.lean
      - name: Compile Arithmetic
        run: lake env lean -DwarningAsError=true Erdos593/UniformSystem/Arithmetic.lean
      - name: Compile entry point
        run: lake env lean -DwarningAsError=true Erdos593/UniformSystem.lean
      - name: Audit the new source
        run: |
          ! grep -R -n -E '\bsorry\b|\badmit\b|^[[:space:]]*axiom[[:space:]]' Erdos593/UniformSystem Erdos593/UniformSystem.lean
