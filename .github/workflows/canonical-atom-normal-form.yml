name: Erdős 593 canonical atom normal form

on:
  pull_request:
    paths:
      - 'reader-first/CANONICAL_ATOM_NORMAL_FORM.md'
      - 'reader-first/CANONICAL_ATOM_NORMAL_FORM.tex'
      - 'experiments/verify_canonical_atom_normal_form.py'
      - 'experiments/canonical_atom_normal_form_results.json'
      - '.github/workflows/canonical-atom-normal-form.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-atom-normal-form-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python -m py_compile experiments/verify_canonical_atom_normal_form.py
      - name: Reproduce exact audit
        run: |
          python experiments/verify_canonical_atom_normal_form.py \
            --output /tmp/canonical_atom_normal_form_results.json
          diff -u \
            experiments/canonical_atom_normal_form_results.json \
            /tmp/canonical_atom_normal_form_results.json
      - name: Check theorem interfaces
        run: |
          grep -F '## The canonical atom theorem' reader-first/CANONICAL_ATOM_NORMAL_FORM.md
          grep -F '## Minimal generating family' reader-first/CANONICAL_ATOM_NORMAL_FORM.md
          grep -F '## One-point-indecomposable obligatory systems' reader-first/CANONICAL_ATOM_NORMAL_FORM.md
          grep -F '## A local rooted-theta reformulation' reader-first/CANONICAL_ATOM_NORMAL_FORM.md
          grep -F '\begin{theorem}[Canonical atom normal form]' reader-first/CANONICAL_ATOM_NORMAL_FORM.tex
          grep -F '\begin{corollary}[Minimal generators]' reader-first/CANONICAL_ATOM_NORMAL_FORM.tex
          grep -F '\begin{corollary}[One-point-indecomposable systems]' reader-first/CANONICAL_ATOM_NORMAL_FORM.tex
